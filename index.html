<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Management System | VMS Ultra Pro</title>
    <meta http-equiv="refresh" content="0; url=./public/index.html">
    <link rel="icon" type="image/svg+xml" href="./public/vms.svg">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .redirect-card {
            text-align: center;
            background: rgba(30, 41, 59, 0.85);
            padding: 32px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            max-width: 400px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(37, 99, 235, 0.2);
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: #60a5fa; text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }
    </style>
    <script>
        // Instant Client-Side Redirection for GitHub Pages
        (function() {
            window.location.replace('./public/index.html');
        })();
    </script>
</head>
<body>
    <div class="redirect-card">
        <div class="spinner"></div>
        <h3 style="margin:0 0 10px; font-weight:700;">VMS Ultra Pro</h3>
        <p style="font-size:14px; color:#94a3b8; margin:0 0 16px;">Redirecting to the main portal...</p>
        <p style="font-size:12px; color:#64748b;">If not redirected automatically, <a href="./public/index.html">click here</a>.</p>
    </div>
</body>
</html>
