    <style>
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --success: #16a34a;
            --dark: #0f172a;
            --text: #334155;
            --border: #e2e8f0;
            --shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8fafc, #eff6ff);
            color: var(--text);
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 40px;
        }

        h2, h3 {
            color: var(--dark);
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1.5px solid var(--border);
        }

        .ai-card {
            background: rgba(124, 58, 237, 0.05);
            border-left: 6px solid var(--secondary);
            border-radius: 12px;
            padding: 24px;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th, td {
            text-align: left;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #f8fafc;
            font-weight: 600;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
        }
    </style>

<script src="/js/ai-response-renderer.js"></script>
</head>
<body>

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 30px;">
        <h2 id="deptTitle">Department Overview</h2>
        <a href="/admin/dashboard" id="backBtn" class="btn"><i class="bi bi-arrow-left"></i> Back to Console</a>
    </div>

    <!-- Dept General Details -->
    <div class="section">
        <p><strong>Code:</strong> <span id="deptCode">Loading...</span></p>
        <p style="margin-top:8px;"><strong>Location:</strong> <span id="deptLoc">Loading...</span></p>
        <p style="margin-top:8px;"><strong>Description:</strong> <span id="deptDesc">Loading...</span></p>
    </div>

    <!-- AI Intelligence Panel -->
    <div class="section">
        <h3>AI Departmental Insights</h3>
        <div class="ai-card">
            <p id="aiText"><i class="bi bi-cpu-fill" style="color:var(--secondary);"></i> Loading AI analysis insights...</p>
        </div>
    </div>

    <!-- DeptAdmins Table -->
    <div class="section">
        <h3>Department Administrators</h3>
        <table>
            <thead>
                <tr>
                    <th>Portal ID</th>
                    <th>Name</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="adminsBody">
                <tr><td colspan="3">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Employees Table -->
    <div>
        <h3>Registered Departmental Staff</h3>
        <table>
            <thead>
                <tr>
                    <th>Emp ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                </tr>
            </thead>
            <tbody id="employeesBody">
                <tr><td colspan="4">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const deptCode = urlParams.get('deptCode');

    const adminToken = localStorage.getItem('adminToken');
    const deptAdminToken = localStorage.getItem('deptAdminToken');
    const employeeToken = localStorage.getItem('employeeToken');

    let token = '';
    let apiUrl = '';
    let backUrl = '/';

    // Use URL path as the authoritative hint for who is visiting
    const currentPath = window.location.pathname;

    if (currentPath.startsWith('/employee')) {
        // Employee visiting
        token = employeeToken;
        apiUrl = `/api/employee/departments/${deptCode}/overview`;
        backUrl = '/employee/dashboard';
    } else if (currentPath.startsWith('/deptadmin')) {
        // Dept Admin visiting
        token = deptAdminToken;
        apiUrl = `/api/deptadmin/departments/${deptCode}/overview`;
        backUrl = '/deptadmin/dashboard';
    } else {
        // Admin visiting (default)
        token = adminToken;
        apiUrl = `/api/admin/departments/${deptCode}/overview`;
        backUrl = '/admin/dashboard';
    }

    // Fallback: if the path-matched token is null, try to detect from any available token
    if (!token) {
        if (adminToken) { token = adminToken; apiUrl = `/api/admin/departments/${deptCode}/overview`; backUrl = '/admin/dashboard'; }
        else if (deptAdminToken) { token = deptAdminToken; apiUrl = `/api/deptadmin/departments/${deptCode}/overview`; backUrl = '/deptadmin/dashboard'; }
        else if (employeeToken) { token = employeeToken; apiUrl = `/api/employee/departments/${deptCode}/overview`; backUrl = '/employee/dashboard'; }
    }

    if (!token || !deptCode) {
        window.location.href = '/';
    }

    document.getElementById('backBtn').href = backUrl;

    async function loadOverview() {
        const res = await fetch(apiUrl, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('deptTitle').innerText = data.department.dept_name;
            document.getElementById('deptCode').innerText = data.department.dept_code;
            document.getElementById('deptLoc').innerText = data.department.dept_location || 'N/A';
            document.getElementById('deptDesc').innerText = data.department.dept_profile || 'No description added.';
            document.getElementById('aiText').innerText = data.aiAnalysis;

            // Load admins table
            const adminsBody = document.getElementById('adminsBody');
            if (data.admins.length === 0) {
                adminsBody.innerHTML = `<tr><td colspan="3" style="text-align:center;">No administrators registered.</td></tr>`;
            } else {
                adminsBody.innerHTML = data.admins.map(a => `
                    <tr>
                        <td>${a.PortalId}</td>
                        <td>${a.Name}</td>
                        <td>${a.Email}</td>
                    </tr>
                `).join('');
            }

            // Load employees table
            const employeesBody = document.getElementById('employeesBody');
            if (data.employees.length === 0) {
                employeesBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No departmental staff.</td></tr>`;
            } else {
                employeesBody.innerHTML = data.employees.map(e => `
                    <tr>
                        <td>${e.PortalId}</td>
                        <td>${e.Name}</td>
                        <td>${e.Email}</td>
                        <td>${e.Role}</td>
                    </tr>
                `).join('');
            }
        }
    }

    loadOverview();
</script>
</body>
